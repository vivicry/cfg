#!~/.tmux.conf

# Options
set -g mouse on
set -s escape-time 0
setw -g aggressive-resize on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on
set -g allow-rename off
setw -g mode-keys vi
set -g focus-events on

# Remove all bad binds
unbind C-b
unbind '"'
unbind %

# Prefix
set -g prefix C-a
bind-key C-a send-prefix

# Config reload
bind-key C-r source-file ~/.tmux.conf \; display "Config reloaded!"

# Tab/pane management
bind-key c new-window -c "#{panel_current_path}"
bind-key b split-window -h -c "#{panel_current_path}"
bind-key v split-window -v -c "#{panel_current_path}"
bind-key C-p previous-window
bind-key C-n next-window

bind-key C-h select-pane -L
bind-key C-j select-pane -D
bind-key C-k select-pane -U
bind-key C-l select-pane -R

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Plug-ins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin '2kabhishek/tmux2k'

# tmux-sidebar config
set -g @sidebar-tree 'e'
set -g @sidebar-tree-focus 'w'
set -g @sidebar-tree-command 'tree -aL 1'
# tmux-resurrect config
set -g @resurrect-save 'F6'
set -g @resurrect-restore 'F7'
# tmux-continuum config
#set -g @continuum-boot 'on'
#set -g @continuum-restore 'on'
# tmux-yank config
set -g @custom_copy_command 'qdbus org.kde.klipper /klipper setClipboardContents'
# tmux-open config
set -g @open-S 'https://www.duckduckgo.com/?q='
# tmux2k config
set -g @tmux2k-left-plugins "session git cwd"
set -g @tmux2k-right-plugins "cpu ram time"
set -g @tmux2k-time-format "%H:%M:%S"
set -g @tmux2k-refresh-rate 1

run '~/.tmux/plugins/tpm/tpm'
